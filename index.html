<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Strict CSP for the keyguard:
        - connect-src 'none': keyguard never makes network requests
        - frame-ancestors https://tutanch.github.io: only the wallet can embed this iframe
        - form-action 'none': no form submissions to external URLs
        Replace https://tutanch.github.io with the wallet's actual origin before deploying,
        e.g. https://tutanch.github.io
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'none'; worker-src 'self' blob:; frame-ancestors https://tutanch.github.io; form-action 'none'; base-uri 'self'; object-src 'none'">
    <title>Nimiq Keyguard</title>
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/styles/keyguard.css">
</head>
<body>
    <!-- All keyguard UI is rendered here by keyguard-app.js -->
    <div id="keyguard-ui" style="display:none;"></div>
    <script type="importmap">
    {
        "imports": {
            "@nimiq/core": "./lib/nimiq-core/web/index.js"
        }
    }
    </script>
    <script type="module" src="src/keyguard-app.js"></script>
</body>
</html>
